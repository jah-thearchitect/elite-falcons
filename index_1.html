<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Training schedule, workouts and payments for Ben Lippen athletes training with Elite Sports Performance.">
<meta property="og:title" content="Elite Falcons"><meta property="og:description" content="Schedule, workouts and weekly group pricing for Ben Lippen athletes training with Elite Sports Performance."><meta property="og:url" content="https://elite-falcons.com"><meta name="theme-color" content="#0C3F2A">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Elite Falcons</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Saira+Condensed:wght@600;700;800&display=swap">
<style id="css">
/* Layout: deep-green header band + split hero (copy / team photo), sport tabs, calendar beside workout-of-the-day, pricing + pay card, coach-only editor below */
:root{
  --bg:#F1EFE4; --surface:#FFFFFF; --surface-2:#F7F6EE; --ink:#0F2219; --muted:#56675C; --line:#D8DACB;
  --green:#0E4D33; --green-2:#13603F; --band:#0C3F2A; --band-ink:#F3EFDF; --gold:#F5A11C; --gold-soft:#FBE2B4; --gold-ink:#7A4A00;
  --red:#C3262C; --ok:#1E7A4C; --warn:#9A5B00;
  --f-display:"Saira Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-label:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09140E; --surface:#10211A; --surface-2:#0D1B14; --ink:#ECEFE4; --muted:#9BAEA2; --line:#22382C;
  --green:#2C8A5C; --green-2:#36A06B; --band:#071A10; --band-ink:#F3EFDF; --gold:#F7AE36; --gold-soft:#3A2A0E; --gold-ink:#F7C46E;
  --red:#E0474D; --ok:#4CC08A; --warn:#F0B35A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09140E; --surface:#10211A; --surface-2:#0D1B14; --ink:#ECEFE4; --muted:#9BAEA2; --line:#22382C;
  --green:#2C8A5C; --green-2:#36A06B; --band:#071A10; --band-ink:#F3EFDF; --gold:#F7AE36; --gold-soft:#3A2A0E; --gold-ink:#F7C46E;
  --red:#E0474D; --ok:#4CC08A; --warn:#F0B35A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
h1,h2,h3{font-family:var(--f-display);line-height:1.02;margin:0;text-wrap:balance;letter-spacing:.005em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding-inline:20px}
.label{font-family:var(--f-label);font-weight:600;text-transform:uppercase;letter-spacing:.09em;font-size:13px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* header band */
.band{background:var(--band);color:var(--band-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;border-bottom:3px solid var(--gold)}
.band .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.band img{height:42px;width:auto;border-radius:6px;display:block}
.band .brand{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.band .brand b{font-family:var(--f-display);font-size:22px;letter-spacing:.02em}
.band .brand span{font-family:var(--f-label);font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.band nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.band nav a{color:var(--band-ink);text-decoration:none;font-family:var(--f-label);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:14px;padding:6px 10px;border-radius:6px}
.band nav a:hover{background:rgba(255,255,255,.08)}
.coach-btn{background:transparent;border:1px solid rgba(243,239,223,.35);color:var(--band-ink);border-radius:6px;padding:6px 12px;font-family:var(--f-label);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:13px;cursor:pointer}
.coach-btn[aria-pressed="true"]{background:var(--gold);color:#1b1200;border-color:var(--gold)}

/* hero */
.hero{background:var(--band);color:var(--band-ink);border-bottom:6px solid var(--gold)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:36px;align-items:center;padding-block:44px 52px}
.hero .eyebrow{font-family:var(--f-label);font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-size:14px}
.hero h1{font-size:clamp(54px,8vw,96px);font-weight:800;text-transform:uppercase;margin-top:6px}
.hero h1 em{font-style:normal;color:var(--gold)}
.stripes{display:flex;flex-direction:column;gap:4px;width:92px;margin:16px 0}
.stripes i{display:block;height:4px;background:var(--band-ink);opacity:.9}
.hero p.lede{font-size:18px;max-width:34ch;opacity:.92}
.next{margin-top:22px;background:rgba(255,255,255,.06);border:1px solid rgba(243,239,223,.18);border-radius:var(--r);padding:12px 14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.next .when{font-family:var(--f-display);font-size:24px;font-weight:700}
.next .what{font-size:14px;opacity:.85}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;padding:11px 18px;font-family:var(--f-label);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:15px;text-decoration:none;cursor:pointer;border:2px solid transparent}
.btn-gold{background:var(--gold);color:#1b1200}
.btn-gold:hover{filter:brightness(1.05)}
.btn-ghost{border-color:rgba(243,239,223,.45);color:var(--band-ink);background:transparent}
.btn-line{border-color:var(--line);background:var(--surface);color:var(--ink)}
.btn-green{background:var(--green);color:#fff}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.photo{position:relative;max-width:100%}
.photo img{display:block;width:100%;height:auto;border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.photo::before{content:"";position:absolute;inset:14px -14px -14px 14px;border:3px solid var(--gold);border-radius:14px;z-index:-1}
.photo{z-index:0;isolation:isolate}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);overflow-x:auto;margin-top:12px}
.tab{appearance:none;border:0;background:transparent;padding:12px 18px;font-family:var(--f-display);font-size:22px;font-weight:700;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:4px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.tab .soon{font-family:var(--f-label);font-size:11px;letter-spacing:.1em;margin-left:6px;vertical-align:middle;color:var(--muted)}

section{padding-block:28px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sec-head h2{font-size:clamp(30px,4vw,40px);text-transform:uppercase;font-weight:800}
.banner{background:var(--gold-soft);color:var(--gold-ink);border-radius:8px;padding:10px 14px;font-size:14px;margin-bottom:16px}

/* calendar + wod */
.train{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.cal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-top h3{font-size:26px;text-transform:uppercase}
.icon-btn{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:18px;line-height:1}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{text-align:center;font-family:var(--f-label);font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;padding-bottom:4px}
.day{aspect-ratio:1/1;max-width:100%;border-radius:8px;border:1px solid transparent;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-variant-numeric:tabular-nums;font-weight:500;color:var(--muted);padding:0}
.day.out{visibility:hidden}
.day.train{background:var(--surface-2);border-color:var(--line);color:var(--ink);font-weight:700;cursor:pointer}
.day.train::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold)}
.day.train:hover{border-color:var(--gold)}
.day.today{box-shadow:inset 0 0 0 2px var(--green-2)}
.day.sel{background:var(--green);border-color:var(--green);color:#fff}
.day.sel::after{background:#fff}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--gold);display:inline-block}
.legend i.t{background:transparent;box-shadow:inset 0 0 0 2px var(--green-2);border-radius:3px}
.up{margin-top:16px;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.up button{display:flex;justify-content:space-between;gap:10px;text-align:left;border:0;background:transparent;padding:6px 4px;border-radius:6px;cursor:pointer;font-size:14px}
.up button:hover{background:var(--surface-2)}
.up button b{font-variant-numeric:tabular-nums}

.wod-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:start}
.wod-date{font-family:var(--f-display);font-size:34px;font-weight:800;text-transform:uppercase}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-family:var(--f-label);font-weight:600;font-size:13px;letter-spacing:.05em;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.chip.gold{background:var(--gold-soft);color:var(--gold-ink);border-color:transparent}
.focus{margin-top:14px;font-size:18px;font-weight:600}
.blocks{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:b}
.blocks>li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;counter-increment:b}
.blocks>li::before{content:counter(b);font-family:var(--f-display);font-weight:800;font-size:28px;color:var(--gold);line-height:1;text-align:center;padding-top:2px}
.blocks h4{margin:0 0 4px;font-family:var(--f-label);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:15px}
.blocks ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.empty{color:var(--muted);padding:20px 0}
.wod-foot{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}

/* pricing */
.price-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tier{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;color:var(--ink);width:100%}
.tier:hover{border-color:var(--gold)}
.tier.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.tier .size{font-family:var(--f-label);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tier .amt{font-family:var(--f-display);font-size:52px;font-weight:800;line-height:1}
.tier .amt small{font-family:var(--f-body);font-size:15px;font-weight:500;color:var(--muted)}
.save{font-size:14px;font-weight:600;color:var(--ok)}
.std{margin-top:12px;font-size:15px;color:var(--muted)}
.std b{color:var(--ink)}
.std s{margin-right:4px}
.pay{margin-top:18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;background:var(--band);color:var(--band-ink);border-radius:12px;padding:22px}
.pay h3{font-size:30px;text-transform:uppercase}
.pay .label{color:rgba(243,239,223,.7)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.pay select,.pay input{background:rgba(255,255,255,.08);border:1px solid rgba(243,239,223,.3);border-radius:8px;padding:10px 12px;color:var(--band-ink);width:100%}
.pay select option{color:#111;background:#fff}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:40px;height:40px;border-radius:8px;border:1px solid rgba(243,239,223,.3);background:rgba(255,255,255,.08);color:var(--band-ink);font-size:20px;cursor:pointer}
.stepper output{min-width:2ch;text-align:center;font-family:var(--f-display);font-size:28px;font-weight:700}
.total{font-family:var(--f-display);font-size:56px;font-weight:800;line-height:1;color:var(--gold)}
.pay .fine{font-size:13px;opacity:.75}
.pay-col{display:flex;flex-direction:column;gap:14px;min-width:0}
.segs{display:flex;gap:6px;flex-wrap:wrap}
.seg{border:1px solid rgba(243,239,223,.3);background:rgba(255,255,255,.06);color:var(--band-ink);border-radius:999px;padding:7px 14px;font-family:var(--f-label);font-weight:600;letter-spacing:.05em;font-size:14px;cursor:pointer}
.seg.on{background:var(--gold);color:#1b1200;border-color:var(--gold)}

.segs-l{display:flex;gap:6px;flex-wrap:wrap}
.seg-l{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:999px;padding:8px 14px;font-family:var(--f-label);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px;cursor:pointer}
.seg-l span{color:var(--muted);font-weight:600;margin-left:4px}
.seg-l.on{background:var(--green);border-color:var(--green);color:#fff}
.seg-l.on span{color:rgba(255,255,255,.8)}
.wu-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.wu-prog{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.wu-bar{height:6px;background:var(--surface-2);border-radius:99px;margin:14px 0;overflow:hidden}
.wu-bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .2s}
.wu-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(var(--rows,1),auto);grid-auto-flow:column;gap:6px 14px}
section{scroll-margin-top:84px}
.wu{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr) 28px;align-items:center;gap:10px;text-align:left;background:transparent;border:1px solid transparent;border-bottom-color:var(--line);border-radius:8px;padding:10px 8px;cursor:pointer;color:var(--ink)}
.wu:hover{border-color:var(--line)}
.wu-n{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--gold);text-align:center}
.wu-t b{display:block;font-weight:600}
.wu-t small{display:block;color:var(--muted);font-size:13px}
.wu-c{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.wu.done .wu-c{background:var(--green);border-color:var(--green)}
.wu.done .wu-t b{color:var(--muted);text-decoration:line-through}
@media (max-width:860px){.wu-list{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-auto-flow:row}}
footer{border-top:1px solid var(--line);margin-top:20px}
footer .wrap{padding-block:22px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}

/* coach mode */
.coach{background:var(--surface);border-top:4px solid var(--gold)}
.coach h2{font-size:34px;text-transform:uppercase}
.coach h3{font-size:22px;text-transform:uppercase;margin-bottom:10px}
.cgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.cbox{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--surface-2);min-width:0}
.cbox label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.cbox input,.cbox select,.cbox textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:15px;color:var(--ink);width:100%;font-weight:400}
.cbox textarea{min-height:200px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.5}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:10px}
.slist{list-style:none;margin:0;padding:0;max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:4px}
.slist li{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:6px 8px;border-radius:6px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.slist li span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:4px 9px;font-size:13px;cursor:pointer;white-space:nowrap}
.mini.danger{color:var(--red)}
.pubbar{position:sticky;bottom:0;background:var(--band);color:var(--band-ink);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;z-index:30}
.hint{font-size:13px;color:var(--muted);margin-top:6px}

@media (max-width:860px){
  .hero{background:var(--band)}
  .hero .wrap,.train,.pay,.cgrid{grid-template-columns:minmax(0,1fr)}
  .price-grid{grid-template-columns:minmax(0,1fr)}
  .band nav{display:none}
  .band .brand span{display:none}
  .band .wrap{flex-wrap:nowrap}
  .band img{height:34px}
  .tier{flex-direction:row;flex-wrap:wrap;align-items:baseline;justify-content:space-between}
  .tier .amt{font-size:40px}
  .photo::before{inset:10px -8px -8px 10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script id="app-js">
(function(){

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){n=Number(n)||0;return '$'+(n%1?n.toFixed(2):n)}

function sportSessions(id){return state.sessions.filter(function(s){return s.sport===(id||ui.sport)}).sort(function(a,b){return (a.date+a.time).localeCompare(b.date+b.time)})}
function sessionOn(date){return sportSessions().filter(function(s){return s.date===date})}

  var d=parse(ui.selected);ui.month=new Date(d.getFullYear(),d.getMonth(),1);
  ui.paySession=up[0]?up[0].id:null;ui.payWeek=up[0]?weekKey(up[0].date):null;

function parseWorkout(text){
  var blocks=[],cur=null;
  String(text||'').split(/\r?\n/).forEach(function(line){
    var l=line.trim();if(!l)return;
    if(l.charAt(0)==='#'){cur={title:l.replace(/^#+\s*/,''),items:[]};blocks.push(cur);return}
    if(!cur){cur={title:'Workout',items:[]};blocks.push(cur)}
    cur.items.push(l.replace(/^[-*•]\s*/,''));
  });
  return blocks;
}

function render(){

  app.innerHTML=header()+hero()+'<main class="wrap">'+tabs()+'<div id="tabpanel" role="tabpanel">'+trainSection()+warmupSection()+paySection()+'</div></main>'+footer()+'<div id="coach"></div>';
  $('#logo').src=LOGO;$('#hero-img').src=HERO;
  if(ui.coach)renderCoach();
}
function rerenderPublic(){
  var keep=$('#coach');var y=window.scrollY;
  var tmp=document.createElement('div');
  tmp.innerHTML=header()+hero()+'<main class="wrap">'+tabs()+'<div id="tabpanel" role="tabpanel">'+trainSection()+warmupSection()+paySection()+'</div></main>'+footer();
  var app=$('#app');
  while(app.firstChild&&app.firstChild!==keep)app.removeChild(app.firstChild);
  while(tmp.firstChild)app.insertBefore(tmp.firstChild,keep);
  $('#logo').src=LOGO;$('#hero-img').src=HERO;
  window.scrollTo(0,y);
}
function header(){

  '</div></header>';
}

  return '<div class="hero"><div class="wrap"><div><div class="eyebrow">Ben Lippen × Elite Sports Performance</div><h1>Elite <em>Falcons</em></h1><div class="stripes" aria-hidden="true"><i></i><i></i></div>'+
  '<p class="lede">'+esc(state.tagline)+'</p>'+next+
  '<div class="cta"><a class="btn btn-gold" href="#pay">Pay for a session</a><a class="btn btn-ghost" href="#workout">See the workout</a><a class="btn btn-ghost" href="#warmups">Warm-ups</a></div></div>'+
  '<figure class="photo" style="margin:0"><img id="hero-img" alt="Ben Lippen junior varsity volleyball team, 2026" width="1400" height="933"></figure></div></div>';
}
function tabs(){
  return '<div class="tabs" role="tablist" aria-label="Sports">'+state.sports.map(function(s){
    var n=sportSessions(s.id).length;
    return '<button class="tab" role="tab" data-act="sport" data-id="'+esc(s.id)+'" aria-selected="'+(s.id===ui.sport)+'">'+esc(s.name)+(n?'':'<span class="soon">Coming soon</span>')+'</button>';
  }).join('')+'</div>';
}
function trainSection(){
  var sample=sportSessions().some(function(s){return s.sample});
  return '<section id="training"><div class="sec-head"><h2>Training schedule</h2><span class="label">Tap a gold day to see that workout</span></div>'+
  (sample?'<div class="banner">Sample schedule shown. The real training days will be posted here soon.</div>':'')+
  '<div class="train"><div class="panel">'+calendar()+'</div><div class="panel" id="workout">'+wod()+'</div></div></section>';
}
function calendar(){
  var m=ui.month,y=m.getFullYear(),mo=m.getMonth();
  var first=new Date(y,mo,1).getDay(),days=new Date(y,mo+1,0).getDate();
  var set={};sportSessions().forEach(function(s){set[s.date]=1});
  var h='<div class="cal-top"><button class="icon-btn" data-act="mprev" aria-label="Previous month">‹</button><h3>'+MONTHS[mo]+' '+y+'</h3><button class="icon-btn" data-act="mnext" aria-label="Next month">›</button></div><div class="grid7">';
  DOW.forEach(function(d){h+='<div class="dow">'+d.charAt(0)+'<span style="position:absolute;left:-9999px">'+d.slice(1)+'</span></div>'});
  for(var i=0;i<first;i++)h+='<div class="day out" aria-hidden="true"></div>';
  for(var d=1;d<=days;d++){

    h+=set[ds]?'<button class="'+cls+'" data-act="day" data-date="'+ds+'" aria-pressed="'+(ds===ui.selected)+'" aria-label="'+esc(longDate(ds))+', training day">'+d+'</button>':'<div class="'+cls+'">'+d+'</div>';
  }

  return h;
}
function wod(){
  var list=sessionOn(ui.selected);
  if(!list.length){
    var sp=sportById(ui.sport);

  }
  return list.map(function(s){
    var t=tierFor(s.groupSize),blocks=parseWorkout(s.workout);

function weekGroup(w){return w?w.sessions.reduce(function(m,s){return Math.max(m,Number(s.groupSize)||0)},0):0}

    if(!sportById(ui.sport))ui.sport=state.sports[0].id;
    pickDefault();rerenderPublic();
  });
}
pickDefault();render();
loadSheet().catch(function(e){if(window.console)console.warn('Using saved schedule; live sheet unavailable:',e&&e.message)});
loadWarmups().catch(function(){});
if(location.hash){setTimeout(function(){var el=document.querySelector(location.hash);if(el)el.scrollIntoView({block:'start'})},60)}
setInterval(function(){if(!document.hidden){loadSheet().catch(function(){});loadWarmups().catch(function(){})}},5*60*1000);
})();

</script>
